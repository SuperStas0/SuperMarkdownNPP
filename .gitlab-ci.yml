# Needs a Windows runner (gitlab.com shared Windows runners, or your own).
# Adjust the tags below if your runner uses different ones.

stages:
  - build
  - release

build:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - choco install -y --no-progress dotnet-8.0-sdk mingw
    - Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
    - refreshenv
  script:
    - |
      $v = (Select-Xml -Path 'SuperMarkdown++.csproj' -XPath '//Version').Node.InnerText
      if ($env:CI_COMMIT_TAG -and "v$v" -ne $env:CI_COMMIT_TAG) { throw "Tag $env:CI_COMMIT_TAG does not match <Version> $v" }
    - cmd /c release.bat
    - |
      if ($env:CI_COMMIT_TAG) {
        $zip = Get-ChildItem release/*.zip | Select-Object -First 1
        Invoke-RestMethod -Method Put -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN } -InFile $zip.FullName -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/supermarkdown/$env:CI_COMMIT_TAG/$($zip.Name)"
      }
  artifacts:
    paths:
      - release/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "SuperMarkdown++ $CI_COMMIT_TAG"
    assets:
      links:
        - name: SuperMarkdown-$CI_COMMIT_TAG-x64.zip
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/supermarkdown/$CI_COMMIT_TAG/SuperMarkdown-$CI_COMMIT_TAG-x64.zip"
          link_type: package
