name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and package
        shell: cmd
        run: release.bat
      - uses: actions/upload-artifact@v4
        with:
          name: SuperMarkdown
          path: release/*
